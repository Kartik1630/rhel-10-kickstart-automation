# RHEL 10 Kickstart Automation
#version=RHEL10

text
cdrom

lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --utc

network --bootproto=dhcp --device=link --activate

rootpw --lock
user --name=kartik --groups=wheel --password=USEYOUROWNPASSWORD --plaintext

firewall --enabled --service=ssh
selinux --enforcing

bootloader --location=mbr
zerombr
clearpart --all --initlabel
autopart

firstboot --disable

%packages
@^minimal-environment
vim
nano
curl
wget
git
bash-completion
tar
unzip
openssh-server
%end

%post --log=/root/kickstart-post.log

systemctl enable sshd

mkdir -p /opt/kickstart-project

echo "RHEL 10 installed using Kickstart" \
> /opt/kickstart-project/info.txt

%end

reboot
